name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ARM64 Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install sdl2 lz4 openssl@3 python@3.12

      - name: Generate miniupnpcstrings.h
        run: |
          cd third_party/miniupnp/miniupnpc
          OS_VER="$(uname -s)/$(uname -r)"
          UPNP_VER="$(cat VERSION)"
          sed -e "s|OS/version|${OS_VER}|" \
              -e "s|\"version\"|\"${UPNP_VER}\"|" \
              miniupnpcstrings.h.in > miniupnpcstrings.h

      - name: Setup and build
        run: |
          python3.12 xenia-build.py setup
          python3.12 xenia-build.py build --config=Release --arch=arm64

      - name: Create DMG
        run: |
          APP_PATH="build/bin/Mac-ARM64/Release/Xenia-Mac-Netplay.app"
          DMG_PATH="Xenia-Mac-Netplay-macOS-ARM64.dmg"
          STAGING_DIR=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "Xenia-Mac-Netplay" \
            -srcfolder "$STAGING_DIR" -ov -format UDZO "$DMG_PATH"
          rm -rf "$STAGING_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xenia-Mac-Netplay-macOS-ARM64
          path: Xenia-Mac-Netplay-macOS-ARM64.dmg

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Xenia-Mac-Netplay-macOS-ARM64

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Xenia-Mac-Netplay ${{ steps.tag.outputs.tag }}
          body: |
            ## Xenia-Mac-Netplay ${{ steps.tag.outputs.tag }}

            Xbox 360 emulator for macOS with netplay support.

            ### Requirements
            - macOS 15.0+ (Sequoia)
            - Apple Silicon (M1/M2/M3/M4/M5)

            ### Install
            1. Download the `.dmg` file below
            2. Open the DMG and drag **Xenia-Mac-Netplay** to Applications
            3. Right-click the app → Open (first launch only, to bypass Gatekeeper)

            ### Homebrew runtime dependencies
            ```
            brew install sdl2 lz4 openssl@3
            ```
          files: Xenia-Mac-Netplay-macOS-ARM64.dmg
          draft: false
          prerelease: false
